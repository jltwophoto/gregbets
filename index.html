<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Greg Index</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
  :root{
    --bg:#0E1613;
    --bg-elevated:#16211C;
    --bg-field:#122019;
    --bg-input:#1C2822;
    --border:#2A3A32;
    --border-soft:#20302A;
    --text:#F1EDE4;
    --text-dim:#9FAEA4;
    --text-faint:#5E6E65;
    --greg:#4C8C4A;
    --greg-soft:rgba(76,140,74,0.16);
    --profit:#D9AF52;
    --loss:#C1544A;
    --neutral:#7C8B82;
    --radius-lg:18px;
    --radius-md:12px;
    --radius-pill:999px;
    --font-display:'Oswald',system-ui,sans-serif;
    --font-body:'Inter',system-ui,sans-serif;
    --font-mono:'IBM Plex Mono',ui-monospace,monospace;
  }
  *,*::before,*::after{box-sizing:border-box;}
  html{color-scheme:dark;}
  body{
    background:var(--bg);
    background-image:
      radial-gradient(ellipse 900px 500px at 20% -10%, rgba(76,140,74,0.10), transparent 60%),
      radial-gradient(ellipse 700px 500px at 100% 0%, rgba(217,175,82,0.06), transparent 55%),
      repeating-linear-gradient(90deg, rgba(255,255,255,0.02) 0px, rgba(255,255,255,0.02) 1px, transparent 1px, transparent 96px);
    color:var(--text);
    font-family:var(--font-body);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  #app{max-width:1080px;margin:0 auto;padding:28px 24px 56px;}
  h1,h2,h3{font-family:var(--font-display);font-weight:600;margin:0;text-wrap:balance;}
  p{margin:0;}
  a{color:inherit;}

  /* header */
  .board-header{
    display:flex;flex-wrap:wrap;align-items:center;gap:20px 28px;
    padding:22px 26px;
    background:linear-gradient(180deg, var(--bg-field), var(--bg-elevated));
    border:1px solid var(--border);
    border-radius:var(--radius-lg);
    margin-bottom:28px;
    position:relative;
    overflow:hidden;
  }
  .eyebrow{
    font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--text-faint);
  }
  .greg-block{display:flex;align-items:center;gap:16px;}
  .avatar{
    width:64px;height:64px;border-radius:var(--radius-pill);
    display:flex;align-items:center;justify-content:center;
    font-family:var(--font-display);font-weight:700;font-size:22px;color:#0E1613;
    flex-shrink:0;position:relative;
    box-shadow:inset 0 -6px 10px rgba(0,0,0,0.18), 0 2px 6px rgba(0,0,0,0.35);
  }
  .avatar--greg{background:linear-gradient(160deg,#66AC5F,var(--greg));}
  .avatar-img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block;}
  .avatar--small{width:34px;height:34px;font-size:12px;font-family:var(--font-mono);font-weight:600;}
  .pl-badge{
    position:absolute;bottom:-6px;right:-10px;
    font-family:var(--font-mono);font-weight:600;font-size:11px;
    padding:3px 7px;border-radius:var(--radius-pill);
    background:var(--bg-elevated);border:1px solid var(--border);
    color:var(--text-dim);
    white-space:nowrap;
  }
  .pl-badge.profit{color:var(--profit);border-color:rgba(217,175,82,0.4);}
  .pl-badge.loss{color:var(--loss);border-color:rgba(193,84,74,0.4);}
  .greg-copy h1{font-size:26px;letter-spacing:.01em;}
  .greg-copy .subtitle{font-size:13px;color:var(--text-dim);margin-top:2px;}

  .ticker{
    margin-left:auto;
    display:flex;flex-direction:column;align-items:flex-end;gap:4px;
    padding-left:24px;border-left:1px solid var(--border-soft);
  }
  .ticker-label{font-family:var(--font-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-faint);}
  .ticker-value{font-family:var(--font-mono);font-weight:600;font-size:30px;font-variant-numeric:tabular-nums;line-height:1;}
  .ticker-value.profit{color:var(--profit);}
  .ticker-value.loss{color:var(--loss);}
  .ticker-value.neutral{color:var(--text-dim);}
  .ticker-breakdown{font-size:12px;color:var(--text-dim);}

  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}

  /* grid */
  .board-grid{
    display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:18px;
  }
  .card{
    background:var(--bg-elevated);
    border:1px solid var(--border);
    border-radius:var(--radius-lg);
    padding:18px 20px 20px;
    display:flex;flex-direction:column;gap:16px;
    border-top:2px solid var(--accent);
  }
  .card-top{display:flex;align-items:center;justify-content:space-between;}
  .bet-type{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-faint);}
  .stake{
    font-family:var(--font-mono);font-size:11px;font-weight:600;color:var(--text-dim);
    background:var(--bg-input);border:1px solid var(--border-soft);border-radius:var(--radius-pill);
    padding:3px 9px;
  }

  .matchup-row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .side{display:flex;align-items:center;gap:10px;min-width:0;}
  .side--opp{flex-direction:row-reverse;}
  .side-copy{display:flex;flex-direction:column;min-width:0;}
  .side-copy--right{align-items:flex-end;text-align:right;}
  .side-name{
    font-family:var(--font-display);font-weight:600;font-size:15px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:130px;
  }
  .side-score{
    font-family:var(--font-mono);font-size:19px;font-weight:600;font-variant-numeric:tabular-nums;
    color:var(--text-dim);
  }

  .meter{position:relative;padding-bottom:22px;}
  .meter-track{
    position:relative;height:10px;border-radius:var(--radius-pill);
    background:var(--bg-input);border:1px solid var(--border-soft);
    overflow:visible;
  }
  .meter-fill{
    position:absolute;top:-1px;bottom:-1px;border-radius:var(--radius-pill);
    transition:left .5s cubic-bezier(.2,.8,.2,1), right .5s cubic-bezier(.2,.8,.2,1), width .5s cubic-bezier(.2,.8,.2,1);
  }
  .meter-center{
    position:absolute;left:50%;top:-3px;bottom:-3px;width:2px;transform:translateX(-1px);
    background:var(--border);border-radius:1px;
  }
  .meter-chip{
    position:absolute;top:18px;transform:translateX(-50%);
    font-family:var(--font-mono);font-size:11px;font-weight:600;letter-spacing:.02em;
    white-space:nowrap;transition:left .5s cubic-bezier(.2,.8,.2,1);
  }


  .bet-status{
    font-family:var(--font-mono);font-size:12px;font-weight:600;white-space:nowrap;padding-bottom:8px;
  }
  .bet-status.profit{color:var(--profit);}
  .bet-status.loss{color:var(--loss);}
  .bet-status.neutral{color:var(--text-dim);}

  footer.note{margin-top:26px;font-size:12.5px;color:var(--text-faint);line-height:1.6;}

  @media (max-width:640px){
    .ticker{margin-left:0;padding-left:0;border-left:none;align-items:flex-start;width:100%;
      border-top:1px solid var(--border-soft);padding-top:14px;}
    .side-name{max-width:90px;}
  }
  @media (prefers-reduced-motion: reduce){
    *{transition:none !important;animation:none !important;}
  }
  
  .result-row{display:flex;align-items:center;justify-content:flex-end;}
  .bet-status{font-family:var(--font-mono);font-size:13px;font-weight:600;white-space:nowrap;}
  .bet-status.profit{color:var(--profit);}
  .bet-status.loss{color:var(--loss);}
  .bet-status.neutral{color:var(--text-dim);}
</style>
</head>

  /* ============================================================
     UPDATE SCORES HERE
     For each matchup, set "greg" to Greg's current points and
     "opp" to the opponent's current points. Save the file and
     push to GitHub (or edit it right on github.com with the
     pencil icon) -- the page rebuilds itself from these numbers,
     nothing else needs to change.
     ============================================================ */
  var SCORES = [
    { id: "champ",    opponent: "3x Champ", initials: "3X", type: "Total Points", color: "#C97B4A", greg: 111.2, opp: 165.6, floor: 25 },
    { id: "gucci",    opponent: "Gucci",    initials: "GU", type: "Total Points", color: "#B5566B", greg: 111.2, opp: 96.5, floor: 25 },
    { id: "andy",     opponent: "Andy",     initials: "AN", type: "Total Points", color: "#6C93A6", greg: 111.2, opp: 103.5, floor: 25 },
    { id: "ladyboys", opponent: "Ladyboys", initials: "LB", type: "Total Points", color: "#9B7EA8", greg: 111.2, opp: 135.1, floor: 25 },
    { id: "commish",  opponent: "Commish",  initials: "CO", type: "Total Points", color: "#8C9B4E", greg: 111.2, opp: 117.6, floor: 25 },
    { id: "adam",     opponent: "Adam",     initials: "AD", type: "IDP Points",   color: "#4FA79A", greg: 3, opp: 11, floor: 8 }
  ];
  /* ============================================================ */

  function fmt(n){
    if (n === null || n === undefined || isNaN(n)) n = 0;
    return (Math.round(n * 10) / 10).toFixed(1);
  }
  function money(n){
    var sign = n > 0 ? "+" : (n < 0 ? "\u2212" : "");
    return sign + "$" + Math.abs(n);
  }
  function escapeHTML(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return { "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","\'":"&#39;" }[c];
    });
  }
  function computeMeter(m){
    var diff = m.greg - m.opp;
    var absDiff = Math.abs(diff);
    var floor = m.floor || 20;
    var scale = Math.max(absDiff * 1.15, floor);
    var pct = 0.5 + (diff / (2 * scale));
    if (pct < 0) pct = 0;
    if (pct > 1) pct = 1;
    return { diff: diff, absDiff: absDiff, pct: pct };
  }
  function plSummary(scores){
    var net = 0, lead = 0, trail = 0, tie = 0;
    scores.forEach(function(m){
      if (m.greg > m.opp) { net += 100; lead++; }
      else if (m.greg < m.opp) { net -= 100; trail++; }
      else tie++;
    });
    return { net: net, lead: lead, trail: trail, tie: tie };
  }
  function betStatus(m){
    if (m.greg > m.opp) return { label: "Greg +$100", cls: "profit" };
    if (m.greg < m.opp) return { label: "Greg \u2212$100", cls: "loss" };
    return { label: "Push \u00b7 $0", cls: "neutral" };
  }

  function renderCard(m){
    var meter = computeMeter(m);
    var status = betStatus(m);
    var pctLeft = Math.min(0.94, Math.max(0.06, meter.pct)) * 100;
    var fillStyle, chipColor, chipText;
    if (meter.diff > 0.05) {
      fillStyle = "left:50%;width:" + (meter.pct - 0.5) * 100 + "%;background:var(--greg);";
      chipColor = "var(--greg)";
      chipText = "GREG +" + fmt(meter.absDiff);
    } else if (meter.diff < -0.05) {
      fillStyle = "right:50%;width:" + (0.5 - meter.pct) * 100 + "%;background:" + m.color + ";";
      chipColor = m.color;
      chipText = m.opponent.toUpperCase() + " +" + fmt(meter.absDiff);
    } else {
      fillStyle = "left:50%;width:0%;background:var(--neutral);";
      chipColor = "var(--neutral)";
      chipText = "EVEN";
    }
    return (
      '<article class="card" style="--accent:' + m.color + '">' +
        '<div class="card-top">' +
          '<span class="bet-type">' + escapeHTML(m.type) + '</span>' +
          '<span class="stake">$100</span>' +
        '</div>' +
        '<div class="matchup-row">' +
          '<div class="side side--greg">' +
            '<div class="avatar avatar--small avatar--greg"><img class="avatar-img" src="' + GREG_AVATAR + '" alt="Greg"></div>' +
            '<div class="side-copy">' +
              '<span class="side-name">Greg</span>' +
              '<span class="side-score">' + fmt(m.greg) + '</span>' +
            '</div>' +
          '</div>' +
          '<div class="side side--opp">' +
            '<div class="side-copy side-copy--right">' +
              '<span class="side-name">' + escapeHTML(m.opponent) + '</span>' +
              '<span class="side-score">' + fmt(m.opp) + '</span>' +
            '</div>' +
            '<div class="avatar avatar--small" style="background:' + m.color + '">' + escapeHTML(m.initials) + '</div>' +
          '</div>' +
        '</div>' +
        '<div class="meter">' +
          '<div class="meter-track">' +
            '<div class="meter-fill" style="' + fillStyle + '"></div>' +
            '<div class="meter-center"></div>' +
            '<div class="meter-chip" style="left:' + pctLeft + '%;color:' + chipColor + '">' + chipText + '</div>' +
          '</div>' +
        '</div>' +
        '<div class="result-row">' +
          '<span class="bet-status ' + status.cls + '">' + status.label + '</span>' +
        '</div>' +
      '</article>'
    );
  }

  function renderPage(){
    var pl = plSummary(SCORES);
    var plCls = pl.net > 0 ? "profit" : (pl.net < 0 ? "loss" : "neutral");
    var badgeCls = pl.net > 0 ? "profit" : (pl.net < 0 ? "loss" : "");
    var cardsHtml = SCORES.map(renderCard).join("");
    return (
      '<div class="eyebrow">2026 Fantasy Preseason \u00b7 Side Bets</div>' +
      '<header class="board-header">' +
        '<div class="greg-block">' +
          '<div class="avatar avatar--greg"><img class="avatar-img" src="' + GREG_AVATAR + '" alt="Greg">' +
            '<span class="pl-badge ' + badgeCls + '">' + money(pl.net) + '</span>' +
          '</div>' +
          '<div class="greg-copy">' +
            '<h1>Greg</h1>' +
            '<p class="subtitle">Six standing bets \u00b7 $100 each</p>' +
          '</div>' +
        '</div>' +
        '<div class="ticker">' +
          '<span class="ticker-label">Net position</span>' +
          '<span class="ticker-value ' + plCls + '">' + money(pl.net) + '</span>' +
          '<span class="ticker-breakdown">' + pl.lead + ' leading \u00b7 ' + pl.trail + ' trailing' + (pl.tie ? ' \u00b7 ' + pl.tie + ' push' : '') + '</span>' +
        '</div>' +
      '</header>' +
      '<div class="board-grid">' + cardsHtml + '</div>' +
      '<footer class="note">The bar starts centered and skews toward whichever side is ahead \u2014 the bigger the lead, the harder it leans. This is a static snapshot: to update it, edit the SCORES block near the top of this file and push the change.</footer>'
    );
  }

  document.getElementById("app").innerHTML = renderPage();
})();
</script>
</body>
</html>
